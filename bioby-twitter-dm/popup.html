<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Bioby Twitter DM</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- 主界面：线索建联 + DM 收录 -->
  <div id="viewMain">
    <header>
      <div class="brand">Bioby · X DM</div>
      <button type="button" id="openSettings" class="linkish" title="设置">⚙</button>
    </header>

    <section class="toolbar">
      <select id="templateSelect" title="话术模板"></select>
      <button type="button" id="refresh" class="primary">刷新</button>
    </section>

    <div id="banner" class="banner hidden"></div>
    <div id="list" class="list"></div>

    <section class="capture">
      <div class="capture-title">收录 DM（阶段4）</div>
      <select id="captureLead"></select>
      <select id="captureDirection">
        <option value="IN">达人回复 IN</option>
        <option value="OUT">我方发出 OUT</option>
      </select>
      <textarea id="captureText" placeholder="粘贴 DM 原文…"></textarea>
      <button type="button" id="captureBtn" class="primary">收录（IN 自动抽报价）</button>
    </section>

    <footer>人工点击发送 · 不自动群发 · <span data-ext-version></span></footer>
  </div>

  <!-- 设置：账号密码登录，自动保存 JWT -->
  <div id="viewSettings" class="hidden">
    <header class="settings-header">
      <button type="button" id="backToMain" class="back-btn" title="返回">← 返回</button>
      <div class="brand">设置 <span data-ext-version></span></div>
      <span class="spacer"></span>
    </header>

    <section class="settings-body">
      <p class="hint">登录 CRM 后自动保存 Token。选测试服务器连线上 CRM，选本地连本机。活动名与 CRM 列表一致，输入关键字即可筛选。</p>

      <label>连接环境</label>
      <div class="seg" id="apiEnvSeg" role="group" aria-label="连接环境">
        <button type="button" class="seg-btn active" data-api-env="test">测试服务器</button>
        <button type="button" class="seg-btn" data-api-env="local">本地环境</button>
      </div>
      <p class="hint">切换环境后需重新登录（Token 不能跨环境使用）。</p>

      <label for="campaignName">活动名称</label>
      <div class="campaign-picker">
        <input id="campaignName" type="text" placeholder="登录后输入关键字搜索活动" autocomplete="off" disabled />
        <ul id="campaignSuggest" class="campaign-suggest hidden" role="listbox"></ul>
      </div>
      <p id="campaignSelectedHint" class="hint">登录后可搜索并选择活动。</p>
      <input id="campaignId" type="hidden" value="" />

      <label>插件角色</label>
      <select id="pluginRole">
        <option value="small">小号</option>
        <option value="big">系统数据库</option>
      </select>

      <label for="businessAccount">个人ID</label>
      <input id="businessAccount" type="text" placeholder="如 small-xihahu" autocomplete="off" />

      <label for="username">账号（用户名）</label>
      <input id="username" type="text" placeholder="CRM 登录用户名" autocomplete="username" />

      <label for="password">密码</label>
      <input id="password" type="password" placeholder="CRM 登录密码" autocomplete="current-password" />

      <div id="loginInfo" class="login-info hidden"></div>
      <div id="settingsStatus" class="banner hidden"></div>

      <div class="settings-actions">
        <button type="button" id="loginSave" class="primary block">登录并保存</button>
        <button type="button" id="testConn" class="ghost block">测试连接</button>
        <button type="button" id="logout" class="ghost block">退出登录</button>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
