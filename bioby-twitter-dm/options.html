<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Bioby Twitter DM</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      background: #15202b;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 24px;
      line-height: 1.55;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #8b98a5; margin: 0 0 12px; font-size: 14px; }
    ol { margin: 0; padding-left: 20px; color: #cfd9de; font-size: 14px; }
    li { margin-bottom: 8px; }
    code { color: #1d9bf0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>请用侧边栏打开扩展</h1>
    <p>v0.3 起主界面在 Chrome <strong>侧边栏</strong>，点击工具栏图标即可打开，操作 X 页面时不会收起。</p>
    <ol>
      <li>打开 <code>chrome://extensions</code> → 重新加载本扩展</li>
      <li>点击工具栏 <strong>Bioby Twitter DM</strong> 图标打开侧栏</li>
      <li>CRM 账号登录 + 填写 Campaign ID；X 解锁码默认 <code>1234</code></li>
      <li>本机 Chrome 需已登录 X，再点「发送私信」或「同步全部对话并抽报价」</li>
    </ol>
  </div>
</body>
</html>
