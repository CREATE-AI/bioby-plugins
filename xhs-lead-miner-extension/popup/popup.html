<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小红书线索挖掘</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>小红书线索挖掘</h1>
    <p class="subtitle">筛出符合 → 打开主页私信 · 不依赖收藏</p>
  </header>

  <section class="panel">
    <label for="aiApiKey">DeepSeek API Key</label>
    <input id="aiApiKey" type="password" placeholder="粘贴 sk- 开头的 Key" autocomplete="off" />
    <div class="hint">填 Key → 开始采集 → 在「符合」里点「开主页」私信客户。</div>
    <div class="actions" style="margin-top:8px">
      <button id="testAiBtn" class="ghost">测试连接</button>
    </div>
    <div id="aiTestResult" class="hint"></div>

    <input id="useAiFilter" type="checkbox" checked hidden />
    <input id="aiApiBaseUrl" type="hidden" value="https://api.deepseek.com/v1" />
    <input id="aiModel" type="hidden" value="deepseek-v4-flash" />
    <input id="aiMinConfidence" type="hidden" value="0.45" />
    <input id="aiPrefilterMode" type="hidden" value="safe" />
    <input id="autoCollect" type="checkbox" hidden />
  </section>

  <section class="panel">
    <label for="keywords">日产词库（每行一个，会轮询直到凑满目标）</label>
    <textarea id="keywords" rows="7" placeholder="求美区达人&#10;找海外红人&#10;…"></textarea>
    <div class="hint">默认约 45 个意图词。凑满「符合」目标会提前结束。</div>

    <div class="grid">
      <label>
        今日目标符合数
        <input id="targetCollectedCount" type="number" min="5" max="50" value="15" />
      </label>
      <label>
        只看近 N 天
        <input id="maxAgeDays" type="number" min="0" max="365" value="7" />
      </label>
    </div>
    <div class="hint">按发帖时间严格筛选（解析不到时间的帖会丢弃）。不点小红书「最新/一周内」（叠加会不准），只由插件按你填的 N 天过滤。</div>
    <input id="targetLeadCount" type="hidden" value="15" />

    <details class="advanced">
      <summary>高级选项（一般不用改）</summary>
      <label for="excludeKeywords">额外排除词（每行一个，命中则过滤）</label>
      <textarea id="excludeKeywords" rows="4" placeholder="就找我们&#10;承接品牌&#10;四种渠道"></textarea>
      <div class="hint">已预置常见噪音词，可增删。</div>
      <div class="grid">
        <label>
          滚动轮次
          <input id="maxScrollRounds" type="number" min="3" max="40" value="15" />
        </label>
        <label>
          每词候选上限
          <input id="maxCandidatesPerKeyword" type="number" min="20" max="300" value="100" />
        </label>
      </div>
      <label class="row-check">
        <input id="autoCollectVisible" type="checkbox" />
        尝试自动收藏（易触发扫码，不推荐）
      </label>
      <label class="row-check">
        <input id="enrichNoteDetail" type="checkbox" checked />
        详情补采正文（限量，提升广告过滤）
      </label>
      <div class="grid">
        <label>
          详情补采上限
          <input id="detailEnrichLimit" type="number" min="0" max="50" value="25" />
        </label>
      </div>
      <label for="aiApiBaseUrlVisible">自定义 API Base（默认勿改）</label>
      <input id="aiApiBaseUrlVisible" type="text" value="https://api.deepseek.com/v1" />
      <label for="aiModelVisible">自定义模型</label>
      <input id="aiModelVisible" type="text" value="deepseek-v4-flash" />
    </details>

    <div class="actions">
      <button id="startBtn" class="primary">开始今日采集</button>
      <button id="stopBtn" class="danger" disabled>停止</button>
    </div>
    <div class="actions" style="margin-top:8px">
      <button id="resetBtn" class="ghost">重置状态</button>
    </div>
  </section>

  <section class="status panel">
    <div id="statusText">状态：待命</div>
    <div id="progressText">进度：-</div>
    <div id="leadCount">本轮：扫描 0 · 符合 0/15</div>
  </section>

  <section class="panel">
    <div class="tabs">
      <button type="button" class="tab active" data-tab="qualified">符合</button>
      <button type="button" class="tab" data-tab="pending">待确认</button>
      <button type="button" class="tab" data-tab="rejected">不符合</button>
      <button type="button" class="tab" data-tab="all">全部</button>
    </div>
    <div class="actions">
      <button id="copyProfilesBtn" class="primary">复制用户ID清单</button>
      <button id="openNextProfileBtn" class="ghost">打开下一位作者</button>
    </div>
    <div class="actions" style="margin-top:8px">
      <button id="exportBtn" class="ghost">导出 HTML 预览</button>
      <button id="collectBtn" class="ghost">补收藏（可选）</button>
    </div>
    <div class="actions" style="margin-top:8px">
      <button id="clearBtn" class="ghost">清空线索</button>
    </div>
    <ul id="leadPreview" class="lead-list"></ul>
  </section>

  <footer>
    <small>最快触达：用导出/复制的用户ID打开主页私信。昵称仅参考，可能重名。</small>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
